services:
  pancake:
    container_name: pancake
    build:
      context: ./services/pancake
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pancake
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  shell:
    container_name: shell
    build:
      context: ./frontend/shell
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    restart: unless-stopped

  mongo:
    container_name: mongo
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: